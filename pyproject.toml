[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-electrica"
version = "0.1.0"
description = "Suite libre para ingeniería eléctrica de distribución en Perú: TopoCraft, LineCraft y GridCraft."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Renzo Mamani" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "ezdxf>=1.1",
    "pyproj>=3.6",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
topocraft = "suite_electrica.topocraft.cli:main"
linecraft = "suite_electrica.linecraft.cli:main"

[project.gui-scripts]
suite-electrica = "suite_electrica.gui.app:main"

[tool.setuptools.packages.find]
include = ["suite_electrica*"]

[tool.setuptools.package-data]
"suite_electrica.plantillas" = ["*.json", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
