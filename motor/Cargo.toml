[package]
name = "suite_motor"
version = "0.1.0"
edition = "2021"
description = "Núcleo de cálculo de Suite Eléctrica (mecánica de conductores) en Rust"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
calamine = "0.38.0"
csv = "1"
printpdf = { version = "0.12.9", default-features = false }
quick-xml = "0.42.0"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
spade = "2"

[dev-dependencies]
